# Netlify: live website Dekvloerexpert.
# Bouwt alle pagina's als statische HTML naar dist/ (sitemap, robots, redirects en headers worden meegebouwd).
# De oude wachtwoord-demo kan nog lokaal met: npm run build:demo
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
